<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reaction - MOOD</title>
    <!-- Tailwind CSS Browser CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@100..900&display=swap" rel="stylesheet">
    <style>
        .font-vietnam {
            font-family: "Be Vietnam Pro", sans-serif;
        }

        .font-noto {
            font-family: "Noto Sans Thai", sans-serif;
        }

        .figma-shadow {
            box-shadow: 0px 0px 24px 0px rgba(0, 0, 0, 0.25);
        }

        /* ---------------------------------------------------- */
        /* ปรับสเกลเมื่อความสูงจอน้อยกว่า 1000px */
        /* ---------------------------------------------------- */
        @media (max-height: 1000px) {
            body {
                padding: 1.5rem !important;
            }

            .heading-title {
                font-size: 2.25rem !important;
                line-height: 1.2 !important;
            }

            .heading-sub {
                font-size: 1.15rem !important;
                margin-top: 0.25rem !important;
            }

            .textarea-box {
                height: 220px !important;
            }

            .btn-continue {
                width: 320px !important;
                padding-top: 0.75rem !important;
                padding-bottom: 0.75rem !important;
                font-size: 1.15rem !important;
            }
        }
    </style>
</head>

<body class="bg-[#FBF9F8] h-screen overflow-hidden p-10 select-none font-noto flex flex-col">

    <!-- Header -->
    <header class="flex justify-end items-center shrink-0 mb-5">
        <!-- รูปโปรไฟล์ -->
        <div class="size-20 bg-white rounded-full">
            <a href="./profile.html" id="profileBtn" title="ไปหน้าโปรไฟล์"
                class="block size-20 rounded-full overflow-hidden bg-gray-300 hover:opacity-80 transition-opacity cursor-pointer border-2 border-white shadow-sm">
                <img id="userAvatar" src="./image/avatar.png" alt="Profile" class="w-full h-full object-cover" />
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex flex-col gap-14 w-full px-10">
        
        <!-- Text Header -->
        <div class="flex flex-col justify-center items-center text-center">
            <h1 class="text-5xl font-extrabold text-black leading-tight heading-title">
                Alrighty, <span id="userAlias">Aliasname</span>
            </h1>
            <h2 class="text-5xl font-extrabold text-black mt-1 heading-title">
                How do we deal with that feeling immediately?
            </h2>
            <p class="text-3xl font-medium text-black mt-6 heading-sub">
                เราจัดการกับความรู้สึกนั้นทันทีด้วยวิธีไหน?
            </p>
        </div>

        <!-- กล่องพิมพ์ข้อความ (Textarea Container) -->
        <div class="w-full relative bg-white rounded-4xl p-8 figma-shadow">
            <!-- ตัวนับจำนวนตัวอักษร มุมขวาบน -->
            <div class="absolute -top-6 -right-6 bg-black text-white text-2xl px-8 py-3 rounded-full font-extrabold font-noto" id="charCounter">
                00/200
            </div>

            <!-- Textarea -->
            <textarea id="reactionInput" maxlength="200" placeholder="พิมพ์สิ่งที่คุณเจอวันนี้ที่นี่..."
                class="w-full h-[350px] text-2xl text-gray-800 placeholder-gray-400 bg-transparent border-none outline-none resize-none pr-16 textarea-box"></textarea>
        </div>

    </main>

    <!-- Footer / ปุ่ม Continue -->
    <footer class="flex justify-center shrink-0 pb-2 mt-10">
        <button type="button" id="finishBtn"
            class="bg-black text-white text-2xl font-extrabold py-8 w-[400px] rounded-full hover:bg-gray-800 active:scale-95 transition-all shadow-md opacity-40 cursor-not-allowed btn-continue"
            disabled>
            Finish
        </button>
    </footer>

    <!-- เรียกใช้ไฟล์ JS -->
    <script src="./reaction.js"></script>
</body>

</html>
