<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - MOOD</title>
    <link href="./output.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@100..900&display=swap" rel="stylesheet">
    <style>
        .font-vietnam {
            font-family: "Be Vietnam Pro", sans-serif;
        }

        .font-noto {
            font-family: "Noto Sans Thai", sans-serif;
        }

        .figma-shadow {
            box-shadow: 0px 4px 13px 0px rgba(0, 0, 0, 0.10);
        }

        .card-border-shadow {
            box-shadow: 0px 8px 20px 0px rgba(0, 0, 0, 0.08);
        }

        /* CSS ปรับขนาดสำหรับความสูงจอต่ำกว่า 1000px */
        @media (max-height: 1000px) {
            body {
                padding: 1.25rem !important;
            }
            .main-container {
                gap: 2.5rem !important;
            }
        }
    </style>
</head>

<body class="bg-[#FBF9F8] min-h-screen p-10 select-none font-noto">
    
    <div class="flex flex-col justify-between gap-y-16 main-container">
        <!-- Header -->
        <header class="flex justify-between items-center">
            <div class="size-20"></div>
            <img src="./image/logo.png" alt="MOOD Logo" class="w-[320px] h-16 object-contain">
            <div class="size-20 bg-white rounded-full">
                <a href="./profile.html" id="profileBtn" title="ไปหน้าโปรไฟล์" 
                class="block size-20 rounded-full overflow-hidden bg-gray-300 hover:opacity-80 transition-opacity cursor-pointer border-2 border-white shadow-sm">
                    <img id="userAvatar" src="./image/avatar.png" alt="Profile" class="w-full h-full object-cover" />
                </a>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex flex-1 items-center pt-10">
            <!-- ฝั่งซ้าย: รูปภาพ Mood -->
            <div class="flex w-1/2 justify-center items-center">
                <img src="./image/mood03.png" alt="Mood Illustration" class="size-[500px] object-contain">
            </div> 

            <!-- ฝั่งขวา: ข้อความ + กล่องคำถามเลือกวัน (ซ่อนไว้ก่อน) + ปุ่ม Start -->
            <div class="flex flex-col w-1/2 justify-center items-center gap-y-6 pr-10">
                
                <!-- Text Header -->
                <div class="flex flex-col justify-center items-center text-center">
                    <h1 class="text-5xl font-extrabold text-black leading-tight">
                        Alrighty, <span id="userAlias">Aliasname</span>
                    </h1>
                    <h2 class="text-5xl font-extrabold text-black mt-1">
                        how are you doing right now
                    </h2>
                    <p class="text-2xl font-medium text-black mt-4">
                        ตอนนี้อารมณ์ของคุณเป็นอย่างไร
                    </p>
                </div>

                <!-- กล่องคำถามเลือกวัน (ซ่อนอยู่เริ่มต้นด้วย class 'hidden') -->
                <div id="dateChoiceCard" class="hidden shadow-2xl flex-col gap-y-6 bg-white border-3 border-black w-3xl rounded-[36px] p-8 card-border-shadow text-center">
                    <p class="text-3xl font-medium text-black leading-snug">
                        ต้องการบันทึกเป็นของวันนี้หรือของวันก่อนหน้า
                    </p>
                    <div class="flex gap-4 justify-center items-center w-full">
                        <!-- ปุ่มวันก่อนหน้า -->
                        <button type="button" id="prevDayBtn" 
                            class="bg-white text-black border border-gray-200 figma-shadow font-bold text-2xl py-6 px-6 rounded-full w-1/2 hover:scale-105 active:scale-95 transition-all cursor-pointer">
                            วันก่อนหน้า
                        </button>
                        <!-- ปุ่มวันนี้ (ค่าเริ่มต้นเลือกวันนี้) -->
                        <button type="button" id="todayBtn" 
                            class="bg-black text-white font-bold text-2xl py-6 px-6 rounded-full w-1/2 hover:scale-105 active:scale-95 transition-all cursor-pointer">
                            วันนี้
                        </button>
                    </div>
                </div>

                <!-- ปุ่ม Start -->
                <button type="button" id="startBtn"
                    class="bg-black text-white text-2xl font-bold py-6 w-[450px] rounded-full hover:bg-gray-800 active:scale-95 transition-all shadow-md cursor-pointer">
                    Start
                </button>
            </div>
        </main>

        <!-- Footer -->
        <footer class="flex justify-center">
            <button type="button" id="historyBtn"
                class="bg-white text-black text-2xl font-extrabold py-8 w-[450px] rounded-full border border-gray-200 figma-shadow hover:bg-gray-50 active:scale-95 transition-all cursor-pointer">
                History of Emotions
            </button>
        </footer>
    </div>

    <script src="./dashboard.js"></script>
</body>

</html>
