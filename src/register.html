<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>register_Self-Reflection</title>
    <link href="./output.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@100..900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: "Noto Sans Thai", sans-serif;
            background-color: #FDFBF7;
        }
    </style>
</head>

<body class="bg-[url(/image/background.png)] w-screen h-screen">
    <div class="flex bg-black/30 backdrop-blur-2xl w-screen h-screen justify-center items-center">
        <div class="relative flex bg-white w-[1798px] h-[962px] rounded-3xl shadow-2xl/40 inset-shadow-sm/30 px-20 py-20 justify-between overflow-hidden">
            <!--ป้ายฝั่งซ้าย-->
            <div class="flex items-center z-10 w-1/3">
                <div class="text-[74px] font-bold ml-10">ลงทะเบียน</div>
            </div>
            <!--image in sign up-->
            <img alt="mood-5" src="./image/mood05.png" class="absolute bottom-0 left-[24%] w-[500px] translate-y-[25%] z-0">
            <!--Singup Email & Passwprd-->
            <div class="flex-col w-[600px] mr-20 z-10">
                <div class="flex justify-center mt-10">
                    <div class="font-extrabold text-[74px]">Sign up</div>
                </div>
                <form>
                    <!--Email-->
                    <div class="mt-20">
                        <label class="block text-2xl font-light text-gray-700 mb-8">Email</label>
                        <input type="email" id="email" required title="อีเมล" placeholder="" class="w-full px-4 py-5 border-b-3 border-black focus:outline-none text-2xl">
                    </div>

                    <!--Password-->
                    <div>
                        <label class="block text-2xl font-light text-gray-700 my-8">Password</label>
                        <input type="password" id="password" required title="รหัสผ่าน" placeholder="" class="w-full px-4 py-5 border-b-3 border-black focus:outline-none text-2xl">
                    </div>

                    <!--Button-->
                    <div class="flex justify-center">
                        <button type="submit" title="Sign up" class="w-[450px] mt-15 bg-black text-white font-extrabold text-2xl h-[100px] rounded-full hover:bg-gray-800 transition-colors">
                            Sign up
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
