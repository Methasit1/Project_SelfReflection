<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>register_Self-Reflection</title>
    <link href="./output.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@100..900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: "Noto Sans Thai", sans-serif;
            background-color: #FDFBF7;
        }

        .figma-shadow {
            box-shadow: 0px 0px 27px 20px rgba(0, 0, 0, 0.25); /* ก๊อปปี้จาก Figma มาวางตรงนี้ */
        }
    </style>
</head>

<body class="bg-[url(./image/background.png)] w-screen h-screen">
    <div class="flex bg-black/30 backdrop-blur-2xl w-screen h-screen justify-center items-center p-15">
        <div class="relative flex bg-white w-full h-full rounded-4xl figma-shadow px-20 py-20 justify-between overflow-hidden">
            <!--ป้ายฝั่งซ้าย-->
            <div class="flex items-center z-10 w-1/3">
                <div class="text-[74px] font-bold ml-10">ลงทะเบียน</div>
            </div>
            <!--image in sign up-->
            <img alt="mood-5" src="./image/mood05.png" class="absolute bottom-0 left-[24%] w-[500px] translate-y-[25%] z-0">
            <!--Singup Email & Passwprd-->
            <div class="flex-col w-[600px] mr-20 z-10">
                <div class="flex justify-center mt-8">
                    <div class="font-extrabold text-[74px]">Sign up</div>
                </div>
                <form id="registerForm" novalidate>
                    <!--Email-->
                    <div class="mt-10">
                        <label class="block text-2xl font-light text-gray-700 mb-5">Email</label>
                        <input type="email" id="email" required title="อีเมล" placeholder=""
                            class="w-full px-4 py-5 border-b-3 border-black focus:outline-none text-2xl">
                    </div>

                    <!--Password-->
                    <div>
                        <label class="block text-2xl font-light text-gray-700 my-5  ">Password</label>
                        <input type="password" id="password" required title="รหัสผ่าน" placeholder=""
                            class="w-full px-4 py-5 border-b-3 border-black focus:outline-none text-2xl">
                    </div>

                    <!--Button-->
                    <div class="flex justify-center">
                        <button type="submit" title="Sign up"
                            class="w-[450px] mt-15 bg-black text-white font-extrabold text-2xl h-[100px] rounded-full hover:bg-gray-800 transition-colors">
                            Sign up
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="./register.js"></script>
</body>

</html>
