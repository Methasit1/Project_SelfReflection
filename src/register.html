<!doctype html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>register_Self-Reflection</title>
    <link href="./output.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@100..900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: "Noto Sans Thai", sans-serif;
            background-color: #FDFBF7;
        }

        .figma-shadow {
            box-shadow: 0px 0px 27px 20px rgba(0, 0, 0, 0.25);
        }
    </style>
</head>

<body class="bg-[url(./image/background.png)] bg-cover bg-center w-screen h-screen overflow-hidden select-none">
    <!-- Outer Overlay Container -->
    <div class="flex bg-black/30 backdrop-blur-2xl w-screen h-screen justify-center items-center p-4 xl:p-8 2xl:p-15">
        
        <!-- Main Card Wrapper -->
        <div class="relative flex bg-white w-full h-full max-h-full rounded-3xl 2xl:rounded-4xl figma-shadow px-8 py-6 xl:px-12 xl:py-10 2xl:px-20 2xl:py-20 justify-between items-center overflow-hidden">
            
            <!-- ป้ายฝั่งซ้าย -->
            <div class="flex items-center z-10 w-1/3">
                <div class="text-4xl xl:text-5xl 2xl:text-[74px] font-bold ml-4 2xl:ml-10 text-gray-900 leading-tight">
                    ลงทะเบียน
                </div>
            </div>

            <!-- Image in sign up (ปรับขนาดตามความสูงจอ แต่ขนาดเดิมเป๊ะที่ 2xl/F11) -->
            <img alt="mood-5" src="./image/mood05.png" 
                class="absolute bottom-0 left-[20%] xl:left-[24%] w-[320px] xl:w-[420px] 2xl:w-[500px] translate-y-[10%] z-0 pointer-events-none transition-all">

            <!-- Form Container ฝั่งขวา -->
            <div class="flex flex-col w-full max-w-[450px] 2xl:max-w-[600px] mr-2 xl:mr-6 2xl:mr-10 z-10 justify-center h-full">
                
                <!-- Header Text -->
                <div class="flex flex-col items-center justify-center gap-y-2 xl:gap-y-4 2xl:gap-y-10">
                    <div class="font-extrabold text-4xl xl:text-5xl 2xl:text-[74px] tracking-tight">Sign up</div>
                    <div class="font-medium text-lg xl:text-2xl 2xl:text-[32px] text-black/50">สมัครสมาชิก</div>
                </div>

                <!-- Form Inputs -->
                <form id="registerForm" class="mt-4 xl:mt-8 2xl:mt-10 space-y-4 xl:space-y-8 2xl:space-y-12" novalidate>
                    <!-- Email -->
                    <div>
                        <label for="email" class="block text-lg xl:text-xl 2xl:text-2xl font-light text-gray-700 mb-2 2xl:mb-5">Email</label>
                        <input type="email" id="email" required title="อีเมล" placeholder=""
                            class="w-full px-4 py-1.5 2xl:py-2 border-b-2 2xl:border-b-3 border-black focus:outline-none text-base xl:text-lg 2xl:text-2xl bg-transparent transition-all">
                    </div>

                    <!-- Password -->
                    <div>
                        <label for="password" class="block text-lg xl:text-xl 2xl:text-2xl font-light text-gray-700 mb-2 2xl:mb-5">Password</label>
                        <input type="password" id="password" required title="รหัสผ่าน" placeholder=""
                            class="w-full px-4 py-1.5 2xl:py-2 border-b-2 2xl:border-b-3 border-black focus:outline-none text-base xl:text-lg 2xl:text-2xl bg-transparent transition-all">
                    </div>

                    <!-- Actions -->
                    <div class="flex flex-col items-center justify-center gap-y-4 xl:gap-y-6 2xl:gap-y-10 pt-2 2xl:pt-4">
                        <button type="submit" title="Sign up"
                            class="w-full max-w-[320px] xl:max-w-[380px] 2xl:max-w-[450px] bg-black text-white font-extrabold text-lg xl:text-xl 2xl:text-2xl h-[55px] xl:h-[70px] 2xl:h-[100px] rounded-full hover:bg-gray-800 active:scale-95 transition-all shadow-lg cursor-pointer">
                            Sign up
                        </button>

                        <!-- ปุ่มย้อนกลับ -->
                        <button id="backBtn" type="button" 
                            class="inline-flex items-center gap-2 2xl:gap-3 text-[#717973] hover:text-black transition-all cursor-pointer group select-none">
                            
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" 
                                class="w-8 h-8 xl:w-10 xl:h-10 2xl:w-16 2xl:h-16 group-hover:-translate-x-1 transition-transform">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M11.25 9L8.25 12m0 0l3 3m-3-3h7.5M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>

                            <span class="text-lg xl:text-2xl 2xl:text-3xl font-medium font-noto">ย้อนกลับ</span>
                        </button> 
                    </div>
                </form>

            </div>
        </div>
    </div>

    <script src="./register.js"></script>
</body>

</html>
