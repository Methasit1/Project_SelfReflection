<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summary - MOOD</title>
    <!-- Tailwind CSS Browser CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@100..900&display=swap" rel="stylesheet">
    <style>
        .font-vietnam { font-family: "Be Vietnam Pro", sans-serif; }
        .font-noto { font-family: "Noto Sans Thai", sans-serif; }

        .figma-shadow { box-shadow: 0px 0px 13px 4px rgba(0, 0, 0, 0.20); }
        @media (max-height: 1000px) {
            body {
                gap: 0rem !important;
            }
            .maginfooter {
                margin-top: 20px;
            }
        }
    </style>
</head>

<body class="flex flex-col gap-y-10 bg-[#F6F4EE] h-screen overflow-hidden p-10 select-none font-noto">

    <!-- Header -->
    <header class="flex justify-between">
        <!-- object เปล่า -->
        <div></div>
        <!--logo mood-->
        <img src="./image/logo.png" alt="MOOD Logo" class="w-[320px] h-16">
        <!-- รูปโปรไฟล์ -->
        <div class="size-20 bg-white rounded-full">
            <a href="./profile.html" id="profileBtn" title="ไปหน้าโปรไฟล์"
                class="block size-20 rounded-full overflow-hidden bg-gray-300 hover:opacity-80 transition-opacity cursor-pointer border-2 border-white shadow-sm">
                <img id="userAvatar" src="./image/avatar.png" alt="Profile" class="w-full h-full object-cover" />
            </a>
        </div>
    </header>

    <!--main-->
    <main class="flex flex-1 items-center justify-center">
        <!--MoodImg-->
        <div class="flex w-1/2 justify-center items-center">
            <img src="./image/mood05.png" alt="Mood Illustration" class="size-[500px]" id="selectmood">
        </div>
        <!--MoodName-->
        <div class="flex flex-col w-1/2 text-center justify-center items-center gap-y-8">

            <div>
                <h1 class="text-3xl font-extrabold text-black leading-tight heading-title">
                    Alrighty, <span id="userAlias">Aliasname</span>
                </h1>
                <h2 class="text-3xl font-extrabold text-black mt-1 heading-title">
                    how are you doing right now
                </h2>
                <p class="text-xl font-medium text-black mt-2 heading-sub">
                    ตอนนี้อารมณ์ของคุณเป็นอย่างไร
                </p>
            </div>

            <h1 class="flex flex-col">
                <span id="moodTitleEn" class="text-9xl font-extrabold text-[#A4D1B6] tracking-tight">
                    “ Good ”
                </span>
                <span id="moodTitleTh" class="text-6xl font-semibold text-[#A4D1B6] mt-2">
                    อารมณ์ดี
                </span>
            </h1>
    </main>

    <footer class="flex justify-center items-center mt-10 maginfooter">
        <div id="historyBox">
            <button type="button" id="historyBtn"
                class="bg-white text-black text-2xl font-extrabold w-[450px] py-8 rounded-full hover:bg-gray-50 hover:scale-105 active:scale-95 transition-all cursor-pointer figma-shadow">
                History of Emotions
            </button>
        </div>
    </footer>
    <!-- เรียกใช้ไฟล์ JS -->
    <script src="./summary.js"></script>
</body>

</html>
