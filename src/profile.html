<!doctype html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - MOOD</title>
    <link href="./output.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@100..900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: "Noto Sans Thai", sans-serif;
        }

        .font-vietnam {
            font-family: "Be Vietnam Pro", sans-serif;
        }

        .font-noto {
            font-family: "Noto Sans Thai", sans-serif;
        }

        .figma-shadow {
            box-shadow: 0px 4px 10px 1px rgba(0, 0, 0, 0.25);
        }

        @media (max-height: 1000px) {
            header {
                padding: 1.25rem !important; /* ลด padding ของ header */
            }
            .logo-img {
                width: 220px !important; /* ย่อโลโก้เล็กน้อย */
            }
            .left-col {
                margin-top: 0.5rem !important;
                row-gap: 2rem !important; /* ลด gap แนวตั้งฝั่งซ้าย */
            }
            .avatar-box {
                width: 350px !important; /* ย่อรูปโปรไฟล์เพื่อให้พอดีจอ */
                height: 350px !important;
            }
            .history-btn {
                padding-top: 1rem !important;
                padding-bottom: 1rem !important;
            }
            .right-col {
                row-gap: 0.5rem !important; /* กระชับระยะห่างการ์ดฝั่งขวา */
            }
        }
    </style>
</head>

<body class="bg-[#FFF5D9]/30 min-h-screen select-none">

    <!-- Top Navigation Bar -->
    <header class="flex flex-col w-full p-10">
        <!-- โลโก้ MOOD ตรงกลาง -->
        <div class="flex justify-center">
            <img src="./image/logo.png" alt="MOOD Logo" class="w-[320px] h-auto">
        </div>

        <!-- ปุ่ม ย้อนกลับ -->
        <button id="backBtn" class="flex w-fit items-center gap-3 font-medium text-black/50 hover:text-black cursor-pointer ml-20">
            <i class="fa-regular fa-circle-left text-3xl mb-1"></i>
            <h1 class="text-3xl font-noto">ย้อนกลับ</h1>
        </button>
    </header>

    <!-- Main Profile Content -->
    <main class="flex">
        <!--img profile-->
        <div class="flex flex-col gap-y-20 justify-center items-center mt-14 w-1/2">
            <div class="bg-white rounded-full size-[500px] figma-shadow">
                <img id="avatarImg" src="./image/mood03.png" alt="Profile Picture" class="w-full h-full rounded-full object-cover">
            </div>
            <div class="flex text-black text-2xl font-bold font-noto bg-white rounded-full py-8 w-md figma-shadow justify-center">History of Emotions</div>
        </div>
        <!--ข้อมูลฝั่งขวา-->
        <div class="flex flex-col gap-4 w-1/2 mr-10">
            <!--name&logout-->
            <div class="flex justify-between items-center">
                <h1 class="text-6xl font-noto font-extrabold">Hi,
                    <span id="userAlias">Aliasname</span>
                </h1>

                <button id="logoutBtn" class="flex items-center gap-2.5 figma-shadow bg-[#93000A]/50 hover:bg-[#c86f6f] text-white px-5 py-4 rounded-full shadow-md font-noto font-medium transition-all active:scale-95 cursor-pointer text-3xl">
                    ออกจากระบบ
                    <i class="fa-solid fa-right-from-bracket text-3xl"></i>
                </button>
            </div>
            <!--email-->
            <div class="flex bg-white figma-shadow items-center px-10 py-10 rounded-4xl gap-5">
                <i class="fa-regular fa-envelope text-4xl text-black"></i>
                <span id="emailText" class="text-3xl font-bold font-noto text-black/90 truncate">
                    example@gmail.com
                </span>
            </div>
            <!--gender & hobby-->
            <div class="flex font-bold font-noto text-3xl gap-4">
                <div id="genderText" class="bg-white rounded-4xl p-10 figma-shadow">gender</div>
                <div id="hobbyText" class="flex justify-center w-full bg-white rounded-4xl figma-shadow items-center">hobby</div>
            </div>
            <!--log mood & log month-->
            <div class="flex font-bold font-noto gap-4">
                <!--log mood-->
                <div class="flex justify-center items-center gap-10 bg-white rounded-4xl figma-shadow w-[55%] py-10">
                    <img src="./image/mood03.png" id="totalMoodImg" alt="mood" class="size-[100px]">
                    <div class="text-3xl font-noto font-semibold space-y-1">
                        <h1>ได้บันทึกอารมณ์ไปแล้ว</h1>
                        <p><span id="totalMood" class="text-5xl font-bold mr-5">Number</span>mood</p>
                    </div>
                </div>
                <!--log month-->
                <div class="flex items-center justify-center gap-10 bg-white rounded-4xl figma-shadow w-[45%]">
                    <i class="fa-regular fa-calendar-days text-6xl text-black/80 mb-1"></i>
                    <div class="text-3xl font-noto font-semibold space-y-1">
                        <h1>ได้บันทึกในเดือนนี้</h1>
                        <p><span id="monthlyCount" class="text-5xl font-bold mr-5">2/30</span>วัน</p>
                    </div>
                </div>
            </div>

        </div>
    </main>
    <script src="./profile.js"></script>
</body>

</html>
